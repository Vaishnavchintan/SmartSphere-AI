[project]
name = "smartsphere-ai"
version = "1.0.0"
description = "Multi-Agent Code Review & Documentation System orchestrating 4 specialized agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "SmartSphere AI Team" }
]
dependencies = [
    "crewai>=0.86.0,<1.0.0",
    "crewai-tools>=0.17.0",
    "langchain>=0.3.9",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.2.10",
    "openai>=1.55.0",
    "tiktoken>=0.8.0",
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.2",
    "python-dotenv>=1.0.1",
    "pylint>=3.3.1",
    "ruff>=0.8.0",
    "bandit>=1.7.10",
]

[project.optional-dependencies]
rag-cpu = ["faiss-cpu>=1.8.0"]
test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "B", "S", "D"]
